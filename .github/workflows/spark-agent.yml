name: Spark Autonomous APK Forge

on:
  push:
    branches: [ main ]
  issues:
    types: [ opened, edited ]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number whose body is the build spec (title must start with 'build:')"
        required: false
        default: ""
      prompt:
        description: "Or paste a build spec directly"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: spark-${{ github.event.issue.number || inputs.issue_number || github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Work out what (if anything) to build
      - name: Resolve Build Request
        id: req
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          IN_ISSUE: ${{ inputs.issue_number }}
          IN_PROMPT: ${{ inputs.prompt }}
        run: |
          NUM=""; TITLE=""; BODY=""
          if [ "$EVENT" = "issues" ]; then
            NUM="$ISSUE_NUM"; TITLE="$ISSUE_TITLE"; BODY="$ISSUE_BODY"
          elif [ -n "$IN_ISSUE" ]; then
            NUM="$IN_ISSUE"
            TITLE=$(gh issue view "$NUM" --json title -q .title)
            BODY=$(gh issue view "$NUM" --json body -q .body)
          elif [ -n "$IN_PROMPT" ]; then
            TITLE="build: manual"; BODY="$IN_PROMPT"
          fi

          if [[ "$TITLE" == build:* ]] && [ -n "$BODY" ]; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
          else
            echo "generate=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ] || [[ "$TITLE" == build:* ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Android project in repo and no build request; nothing to compile."
          fi
          echo "issue=$NUM" >> "$GITHUB_OUTPUT"
          { echo "PROMPT_TEXT<<SPARK_EOF"; echo "$BODY"; echo "SPARK_EOF"; } >> "$GITHUB_ENV"

      - name: Set up JDK 17
        if: steps.req.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: steps.req.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Install Python Dependencies
        if: steps.req.outputs.build == 'true'
        run: pip install requests

      - name: Accept Android SDK Licenses
        if: steps.req.outputs.build == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Step 1: Spark architects the code from the spec
      - name: Generate Code from Issue
        if: steps.req.outputs.generate == 'true'
        run: python3 .github/scripts/spark.py generate

      # Step 2: Build & Self-Heal loop
      - name: Run Build and Self-Heal
        if: steps.req.outputs.build == 'true'
        run: |
          MAX_ATTEMPTS=6
          ATTEMPT=1
          SUCCESS=false

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "[*] Compile Attempt $ATTEMPT of $MAX_ATTEMPTS..."
            set +e
            gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build_log.txt
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              SUCCESS=true
              break
            fi
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "[!] Build failed. Requesting autonomous repair from Gemini..."
              python3 .github/scripts/spark.py heal || true
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$SUCCESS" = false ]; then
            echo "::error::Failed to compile after $MAX_ATTEMPTS attempts."
            exit 1
          fi
          ls -la app/build/outputs/apk/debug/

      # Step 3: Upload the artifact to Actions
      - name: Upload Artifact
        if: steps.req.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Generated Source
        if: always() && steps.req.outputs.generate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-source
          path: |
            .
            !.git
            !**/build/**
            !.gradle
          if-no-files-found: ignore

      # Step 4: If an issue triggered this, release and post link in comments
      - name: Publish Release for Issue
        if: steps.req.outputs.issue != ''
        uses: softprops/action-gh-release@v2
        id: create_release
        with:
          tag_name: build-${{ steps.req.outputs.issue }}-${{ github.run_id }}
          name: "Spark Build: Issue #${{ steps.req.outputs.issue }}"
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true

      - name: Comment Download Link on Issue
        if: steps.req.outputs.issue != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: Number("${{ steps.req.outputs.issue }}"),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Spark Build Complete\n\nYour APK compiled cleanly.\n\n**[Download Your APK Here](${{ steps.create_release.outputs.url }})**`
            });

      - name: Comment Failure on Issue
        if: failure() && steps.req.outputs.issue != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: Number("${{ steps.req.outputs.issue }}"),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Spark Build Failed\n\nSee the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for logs. Edit this issue to retry.`
            });
