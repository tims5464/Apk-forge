name: Autonomous Android Build & Self-Heal

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Android Build
        id: build_step
        continue-on-error: true
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Self-Healing Trigger on Failure
        if: env.EXIT_CODE != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "[!] Build failed with code $EXIT_CODE. Launching autonomous repair cycle..."
          
          # Extract the final 100 lines containing the failure stack
          ERR_SNIPPET=$(tail -n 100 build_log.txt | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          
          # Query Gemini 2.5 Flash for the fix
          PROMPT="The following Android Gradle build failed. Analyze the compiler error and output ONLY a JSON object with two fields: 'target_file' (relative path to the broken file) and 'fixed_content' (the complete, fixed contents of that file with no markdown fences). Log:\n$ERR_SNIPPET"
          
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"contents\": [{\"parts\": [{\"text\": \"$PROMPT\"}]}], \"generationConfig\": {\"responseMimeType\": \"application/json\"}}" > response.json

          # Extract patch data using python3
          python3 -c '
          import json, os
          with open("response.json") as f:
              res = json.load(f)
          raw_text = res["candidates"][0]["content"]["parts"][0]["text"]
          data = json.loads(raw_text)
          target = data["target_file"]
          content = data["fixed_content"]
          os.makedirs(os.path.dirname(target), exist_ok=True)
          with open(target, "w") as out:
              out.write(content)
          '

          # Commit repair back to main
          git config user.name "Autonomous Spark Builder"
          git config user.email "spark-agent@github-actions.local"
          git add -A
          git commit -m "Auto-repair compile error [skip ci]"
          git push origin main
          
          echo "Patch committed. Triggering fresh compile..."
          gradle assembleDebug --stacktrace

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
